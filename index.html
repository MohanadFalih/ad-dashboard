<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deniz Ad Command Center</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0f">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a25;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --accent: #ff4757;
      --accent-glow: rgba(255, 71, 87, 0.3);
      --warning: #ffa502;
      --success: #2ed573;
      --info: #1e90ff;
      --danger: #ff4757;
      --dead: #57606f;
      --orange: #f59e0b;
      --gray: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    h1 span { color: var(--accent); }

    .refresh-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: var(--border);
      transform: translateY(-1px);
    }

    .refresh-btn.spinning svg { animation: spin 1s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .date-controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .preset-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .preset-btn:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    .preset-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .date-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
      margin: 0 4px;
    }

    .date-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-input-group input[type="date"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      color-scheme: dark;
    }

    .date-input-group input[type="date"]:focus {
      border-color: var(--accent);
    }

    .date-input-group span {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .apply-btn {
      background: var(--info);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .apply-btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .range-display {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text-dim);
      background: var(--surface-2);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-2px); }

    .card-value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card.healthy { border-color: rgba(46, 213, 115, 0.3); }
    .card.healthy .card-value { color: var(--success); }

    .card.watch { border-color: rgba(255, 165, 2, 0.3); }
    .card.watch .card-value { color: var(--warning); }

    .card.refresh { border-color: rgba(245, 158, 11, 0.3); }
    .card.refresh .card-value { color: var(--orange); }

    .card.kill { border-color: rgba(255, 71, 87, 0.3); }
    .card.kill .card-value { color: var(--danger); }

    .card.review { border-color: rgba(107, 114, 128, 0.3); }
    .card.review .card-value { color: var(--gray); }

    .card.gathering { border-color: rgba(107, 114, 128, 0.3); }
    .card.gathering .card-value { color: var(--gray); }

    .card.dead { border-color: rgba(87, 96, 111, 0.3); }
    .card.dead .card-value { color: var(--dead); }

    .card.money { border-color: rgba(30, 144, 255, 0.3); }
    .card.money .card-value { color: var(--info); }

    .kill-section {
      background: linear-gradient(135deg, rgba(255, 71, 87, 0.08), rgba(255, 71, 87, 0.02));
      border: 1px solid rgba(255, 71, 87, 0.25);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .kill-section h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 71, 87, 0.06);
      border-radius: 10px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
    }

    .kill-item-name { font-weight: 600; font-size: 0.9rem; }
    .kill-item-reason { font-size: 0.8rem; color: var(--text-dim); }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 0.8fr 0.8fr 0.7fr 0.7fr 0.7fr 0.7fr 0.8fr 1fr;
      gap: 8px;
      padding: 14px 16px;
      background: var(--surface-2);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    .ad-row {
      display: grid;
      grid-template-columns: 2fr 0.8fr 0.8fr 0.7fr 0.7fr 0.7fr 0.7fr 0.8fr 1fr;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      font-size: 0.85rem;
      transition: background 0.15s;
    }

    .ad-row:hover { background: var(--surface-2); }
    .ad-row:last-child { border-bottom: none; }

    .ad-name { font-weight: 600; }
    .ad-campaign { font-size: 0.75rem; color: var(--text-dim); }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-healthy { background: rgba(46, 213, 115, 0.15); color: var(--success); }
    .badge-watch { background: rgba(255, 165, 2, 0.15); color: var(--warning); }
    .badge-refresh_creative { background: rgba(245, 158, 11, 0.15); color: var(--orange); }
    .badge-kill { background: rgba(255, 71, 87, 0.15); color: var(--danger); }
    .badge-in_review { background: rgba(107, 114, 128, 0.15); color: var(--gray); }
    .badge-gathering_data { background: rgba(107, 114, 128, 0.15); color: var(--gray); }
    .badge-dead { background: rgba(87, 96, 111, 0.15); color: var(--dead); }

    .num { font-family: 'SF Mono', Monaco, monospace; font-weight: 600; }
    .num-neg { color: var(--danger); }
    .num-pos { color: var(--success); }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
    }

    .error-box {
      background: rgba(255, 71, 87, 0.1);
      border: 1px solid rgba(255, 71, 87, 0.3);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      margin: 40px auto;
      max-width: 600px;
    }

    .error-box h3 { color: var(--accent); margin-bottom: 8px; }
    .error-box p { color: var(--text-dim); font-size: 0.9rem; }
    .error-box code {
      background: var(--surface-2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text);
    }

    .last-updated {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.75rem;
      margin-top: 20px;
    }

    .health-note {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 4px;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .table-header, .ad-row {
        grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
      }
      .table-header > :nth-child(5),
      .table-header > :nth-child(6),
      .table-header > :nth-child(7),
      .ad-row > :nth-child(5),
      .ad-row > :nth-child(6),
      .ad-row > :nth-child(7) { display: none; }
    }

    @media (max-width: 600px) {
      .date-controls { flex-direction: column; align-items: stretch; }
      .range-display { margin-left: 0; text-align: center; }
      .preset-btns { justify-content: center; }
      h1 { font-size: 1.2rem; }
    }
  </style>
<base target="_blank">
<base target="_blank">
</head>
<body>
  <div class="container">
    <header>
      <h1>Deniz <span>Ad Command Center</span></h1>
      <button class="refresh-btn" onclick="loadData()" id="refreshBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Pull to refresh
      </button>
    </header>

    <div class="date-controls">
      <div class="preset-btns">
        <button class="preset-btn" data-preset="today" onclick="setPreset('today')">Today</button>
        <button class="preset-btn active" data-preset="yesterday" onclick="setPreset('yesterday')">Yesterday</button>
        <button class="preset-btn" data-preset="last_7d" onclick="setPreset('last_7d')">Last 7 Days</button>
        <button class="preset-btn" data-preset="last_30d" onclick="setPreset('last_30d')">Last 30 Days</button>
      </div>
      <div class="date-divider"></div>
      <div class="date-input-group">
        <input type="date" id="startDate" />
        <span>to</span>
        <input type="date" id="endDate" />
        <button class="apply-btn" onclick="applyCustomRange()">Apply</button>
      </div>
      <div class="range-display" id="rangeDisplay">Yesterday</div>
    </div>

    <div id="app">
      <div class="loading">Loading...</div>
    </div>

    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <script>
    let currentPreset = 'yesterday';
    let customStart = null;
    let customEnd = null;

    document.addEventListener('DOMContentLoaded', () => {
      const yesterday = getOffsetDate(-1);
      document.getElementById('startDate').value = yesterday;
      document.getElementById('endDate').value = yesterday;
      loadData();
    });

    function getOffsetDate(offset) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().split('T')[0];
    }

    function setPreset(preset) {
      currentPreset = preset;
      customStart = null;
      customEnd = null;

      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-preset="${preset}"]`).classList.add('active');

      const labels = {
        today: 'Today',
        yesterday: 'Yesterday',
        last_7d: 'Last 7 Days',
        last_30d: 'Last 30 Days'
      };
      document.getElementById('rangeDisplay').textContent = labels[preset] || preset;

      loadData();
    }

    function applyCustomRange() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      if (!start || !end) {
        alert('Please select both start and end dates');
        return;
      }
      if (start > end) {
        alert('Start date must be before end date');
        return;
      }

      currentPreset = null;
      customStart = start;
      customEnd = end;

      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('rangeDisplay').textContent = `${start} → ${end}`;

      loadData();
    }

    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">Pulling fresh data from Meta...</div>';

      try {
        let url = '/api/ads';
        if (customStart && customEnd) {
          url += `?start=${customStart}&end=${customEnd}`;
        } else if (currentPreset) {
          url += `?preset=${currentPreset}`;
        }

        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          throw new Error(typeof data.error === 'string' ? data.error : data.error.message || JSON.stringify(data.error));
        }

        render(data);
      } catch (err) {
        app.innerHTML = `
          <div class="error-box">
            <h3>🚨 Meta API Error</h3>
            <p>${escapeHtml(err.message)}</p>
            <p style="margin-top:12px;font-size:0.8rem">
              <strong>Most likely cause:</strong> Access token expired.<br>
              Generate a <strong>System User token</strong> in Business Manager — it never expires.
            </p>
          </div>
        `;
      } finally {
        btn.classList.remove('spinning');
      }
    }

    function render(data) {
      const { summary, ads } = data;
      const app = document.getElementById('app');

      // ── SUMMARY CARDS (7 health states + 5 metrics) ──
      const summaryHTML = `
        <div class="summary-grid">
          <div class="card money">
            <div class="card-value">$${summary.totalSpent}</div>
            <div class="card-label">Total Spent</div>
          </div>
          <div class="card money">
            <div class="card-value">$${summary.totalRevenue || '0.00'}</div>
            <div class="card-label">Revenue</div>
          </div>
          <div class="card money">
            <div class="card-value">${summary.totalPurchases}</div>
            <div class="card-label">Purchases</div>
          </div>
          <div class="card money">
            <div class="card-value">${summary.avgCPA || '—'}</div>
            <div class="card-label">Avg CPA</div>
          </div>
          <div class="card money">
            <div class="card-value">${summary.avgROAS || '—'}</div>
            <div class="card-label">Avg ROAS</div>
          </div>
          <div class="card healthy">
            <div class="card-value">${summary.healthy || 0}</div>
            <div class="card-label">Healthy</div>
          </div>
          <div class="card watch">
            <div class="card-value">${summary.watch || 0}</div>
            <div class="card-label">Watch</div>
          </div>
          <div class="card refresh">
            <div class="card-value">${summary.refreshCreative || 0}</div>
            <div class="card-label">Refresh Creative</div>
          </div>
          <div class="card kill">
            <div class="card-value">${summary.kill || 0}</div>
            <div class="card-label">Kill Now</div>
          </div>
          <div class="card review">
            <div class="card-value">${summary.inReview || 0}</div>
            <div class="card-label">In Review</div>
          </div>
          <div class="card gathering">
            <div class="card-value">${summary.gatheringData || 0}</div>
            <div class="card-label">Gathering Data</div>
          </div>
          <div class="card dead">
            <div class="card-value">${summary.dead || 0}</div>
            <div class="card-label">Dead</div>
          </div>
        </div>
      `;

      // ── KILL SECTION ──
      let killHTML = '';
      if (summary.killList && summary.killList.length > 0) {
        killHTML = `
          <div class="kill-section">
            <h2>🚨 KILL THESE ADS NOW</h2>
            ${summary.killList.map(k => `
              <div class="kill-item">
                <span class="kill-item-name">${escapeHtml(k.name)}</span>
                <span class="kill-item-reason">${escapeHtml(k.reason)}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      // ── TABLE ──
      const tableHTML = `
        <div class="table-container">
          <div class="table-header">
            <div>Ad Set / Campaign</div>
            <div>Status</div>
            <div>Health</div>
            <div>Spent</div>
            <div>Purch</div>
            <div>CPA</div>
            <div>CPM</div>
            <div>Freq</div>
            <div>Action</div>
          </div>
          ${ads.map(ad => {
            const cpmDisplay = ad.cpm ? `$${ad.cpm}` : '—';
            const cpmPctDisplay = (ad.cpmVsBaseline !== null && ad.cpmVsBaseline !== undefined)
              ? `(${ad.cpmVsBaseline > 0 ? '+' : ''}${ad.cpmVsBaseline}%)`
              : '';
            const freqDisplay = ad.frequency ? ad.frequency : '—';

            // Action color based on health state
            const actionColors = {
              healthy: 'success',
              watch: 'warning',
              refresh_creative: 'orange',
              kill: 'danger',
              in_review: 'gray',
              gathering_data: 'gray',
              dead: 'dead'
            };
            const actionColor = actionColors[ad.health] || 'text-dim';

            // Health note tooltip
            const noteHTML = ad.healthNote
              ? `<div class="health-note">${escapeHtml(ad.healthNote)}</div>`
              : '';

            return `
            <div class="ad-row">
              <div>
                <div class="ad-name">${escapeHtml(ad.name)}</div>
                <div class="ad-campaign">${escapeHtml(ad.campaign)}</div>
              </div>
              <div class="num">${ad.status}</div>
              <div>
                <span class="badge badge-${ad.health}">${formatHealthLabel(ad.health)}</span>
                ${noteHTML}
              </div>
              <div class="num">$${ad.spent.toFixed(2)}</div>
              <div class="num">${ad.purchases}</div>
              <div class="num">${ad.cpa ? '$' + ad.cpa : '—'}</div>
              <div class="num ${ad.cpmVsBaseline > 0 ? 'num-neg' : 'num-pos'}">
                ${cpmDisplay} ${cpmPctDisplay}
              </div>
              <div class="num">${freqDisplay}</div>
              <div style="font-size:0.8rem;font-weight:600;color:var(--${actionColor})">
                ${escapeHtml(ad.action)}
              </div>
            </div>
          `}).join('')}
        </div>
      `;

      app.innerHTML = summaryHTML + killHTML + tableHTML;

      // Show both display range and health window
      const healthInfo = summary.healthWindow
        ? ` · Health window: ${summary.healthWindow}`
        : '';
      document.getElementById('lastUpdated').textContent =
        `Last refresh: ${summary.lastRefresh} · Range: ${summary.dateRange || 'Yesterday'}${healthInfo}`;
    }

    function formatHealthLabel(health) {
      const labels = {
        healthy: 'Healthy',
        watch: 'Watch',
        refresh_creative: 'Refresh',
        kill: 'Kill',
        in_review: 'In Review',
        gathering_data: 'Gathering',
        dead: 'Dead'
      };
      return labels[health] || health;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
